name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Run all test suites
        run: python3 tests/run_all.py
